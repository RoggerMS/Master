<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft Bedrock 26.45 | PatoNuclear</title>
<meta name="description" content="Página ligera de PatoNuclear para acceder a recursos permitidos relacionados con Minecraft Bedrock 26.45.">
<style>
:root{
  --bg:#08141e;
  --card:#102334;
  --text:#f7fbff;
  --muted:#b8c6d1;
  --cyan:#35c7ff;
  --green:#75ed86;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:16px;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 20%,rgba(53,199,255,.15),transparent 26%),
    radial-gradient(circle at 85% 15%,rgba(117,237,134,.10),transparent 24%),
    linear-gradient(180deg,#06101a,var(--bg));
}
.card{
  width:min(720px,100%);
  padding:24px;
  border-radius:26px;
  text-align:center;
  background:rgba(16,35,52,.95);
  border:1px solid var(--line);
  box-shadow:0 22px 55px rgba(0,0,0,.34);
}
.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}
.duck{
  width:54px;height:54px;
  display:grid;place-items:center;
  border-radius:17px;
  font-size:31px;
  background:linear-gradient(135deg,#ffe34e,#ff9f1a);
}
.brand strong{
  font-size:30px;
  letter-spacing:-.03em;
}
.game{
  padding:22px 16px;
  border:1px solid rgba(53,199,255,.20);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(53,199,255,.08),rgba(117,237,134,.04));
}
.game-icon{
  font-size:52px;
  line-height:1;
}
h1{
  margin:12px 0 4px;
  font-size:clamp(28px,6vw,46px);
  letter-spacing:-.04em;
  line-height:1.02;
}
.version{
  display:inline-block;
  margin:10px 0 22px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(53,199,255,.11);
  border:1px solid rgba(53,199,255,.22);
  font-weight:800;
  color:#d9f5ff;
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:min(360px,100%);
  margin:0 auto;
  padding:18px 22px;
  border-radius:17px;
  text-decoration:none;
  font-size:20px;
  font-weight:950;
  color:#041015;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  box-shadow:0 14px 32px rgba(53,199,255,.24);
}
.small{
  margin:14px 0 0;
  color:var(--muted);
  font-size:13px;
}
.icons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}
.icon{
  min-width:92px;
  padding:10px 12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  border-radius:14px;
  font-size:13px;
}
.icon b{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
footer{
  margin-top:18px;
  color:#91a4b3;
  font-size:12px;
}
@media(max-width:500px){
  .card{padding:18px 14px}
  .brand strong{font-size:26px}
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="duck">🦆</div>
    <strong>PatoNuclear</strong>
  </div>

  <section class="game">
    <div class="game-icon">⛏️</div>
    <h1>Minecraft Bedrock</h1>
    <div class="version">26.45 · Android</div>

    <a class="btn" href="https://subtounlock.app/u/paton2645" target="_blank" rel="noopener noreferrer">
      ⬇️ DESCARGAR
    </a>

    <p class="small">Un botón. Sin anuncios. Sin ventanas falsas.</p>
  </section>

  <div class="icons">
    <div class="icon"><b>📱</b>Android</div>
    <div class="icon"><b>⚡</b>Rápido</div>
    <div class="icon"><b>🚫</b>Sin anuncios</div>
    <div class="icon"><b>🛡️</b>Enlace limpio</div>
  </div>

  <footer>PatoNuclear · Minecraft Bedrock 26.45</footer>
</main>
</body>
</html>
