<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EL JUEGO en la VERSION 26.45 | PatoNuclear</title>

<meta
  name="description"
  content="Página ligera de PatoNuclear para acceder a recursos relacionados con Minecraft Bedrock 26.45."
>

<style>

:root{
  --bg-dark:#090a0c;
  --bg-dark-2:#17191d;

  --card:#fffaf4;
  --card-light:#fffdf9;

  --text:#2b211d;
  --muted:#776a63;

  --red:#e52323;
  --red-hover:#cf1717;

  --orange:#ff963b;

  --line:rgba(145,100,70,.16);
}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
}

body{
  margin:0;

  min-height:100vh;

  display:grid;
  place-items:center;

  padding:18px;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(255,255,255,.05),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 85%,
      rgba(255,100,50,.06),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      var(--bg-dark),
      var(--bg-dark-2)
    );
}


/* =========================
   TARJETA PRINCIPAL
========================= */

.card{
  width:min(720px,100%);

  padding:28px 24px;

  border-radius:26px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      var(--card)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 25px 70px rgba(0,0,0,.48),
    0 0 0 1px rgba(0,0,0,.03);
}


/* =========================
   LOGO PATONUCLEAR
========================= */

.brand{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:12px;

  margin-bottom:20px;
}


/* CONTENEDOR DEL PATO */

.duck{
  width:78px;
  height:78px;

  flex:0 0 78px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:
    radial-gradient(
      circle at 30% 25%,
      rgba(255,255,255,.5),
      transparent 40%
    ),
    linear-gradient(
      135deg,
      #ffe45c,
      #ff9f1a
    );

  padding:5px;

  box-shadow:
    0 8px 18px rgba(255,159,26,.25),
    inset 0 1px 0 rgba(255,255,255,.45);

  overflow:hidden;
}


/* IMAGEN OPTIMIZADA */

.duck img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  filter:
    drop-shadow(
      0 2px 3px rgba(0,0,0,.14)
    );
}


.brand strong{
  font-size:30px;

  font-weight:900;

  letter-spacing:-.035em;

  color:var(--text);
}


/* =========================
   BLOQUE PRINCIPAL
========================= */

.game{
  padding:24px 17px;

  border-radius:22px;

  border:
    1px solid rgba(210,150,100,.18);

  background:
    linear-gradient(
      180deg,
      var(--card-light),
      #fff5e9
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8);
}


/* ICONO */

.game-icon{
  font-size:50px;

  line-height:1;

  margin-bottom:6px;
}


/* TITULO */

h1{
  margin:10px 0 4px;

  font-size:
    clamp(
      30px,
      6vw,
      46px
    );

  font-weight:950;

  letter-spacing:-.045em;

  line-height:1;

  color:var(--text);
}


/* VERSION */

.version{
  display:inline-block;

  margin:
    12px 0
    16px;

  padding:
    8px 16px;

  border-radius:999px;

  background:#fff0df;

  border:
    1px solid
    rgba(255,150,59,.28);

  color:#d86500;

  font-weight:850;

  font-size:14px;
}


/* =========================
   NOVEDADES
========================= */

.update-info{
  max-width:480px;

  margin:
    0 auto
    21px;

  padding:
    11px
    14px;

  border-radius:12px;

  background:
    rgba(
      255,
      255,
      255,
      .78
    );

  border:
    1px dashed
    rgba(210,140,90,.28);

  color:var(--muted);

  font-size:14px;

  line-height:1.45;
}


/* =========================
   BOTON PRINCIPAL ROJO
========================= */

.btn{
  width:min(360px,100%);

  margin:0 auto;

  padding:
    18px
    22px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;

  border-radius:17px;

  border:
    1px solid
    rgba(150,0,0,.20);

  text-decoration:none;

  color:#ffffff;

  font-size:20px;

  font-weight:950;

  letter-spacing:.01em;

  background:
    linear-gradient(
      180deg,
      #f33636,
      var(--red)
    );

  box-shadow:
    0 12px 28px
    rgba(229,35,35,.35),
    inset 0 1px 0
    rgba(255,255,255,.20);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}


/* HOVER */

.btn:hover{
  transform:
    translateY(-2px);

  background:
    linear-gradient(
      180deg,
      #ff3e3e,
      var(--red-hover)
    );

  box-shadow:
    0 17px 34px
    rgba(229,35,35,.44);
}


/* CLICK */

.btn:active{
  transform:
    translateY(0)
    scale(.99);
}


/* =========================
   TEXTO PEQUEÑO
========================= */

.small{
  margin:
    14px 0
    0;

  color:var(--muted);

  font-size:13px;
}


/* =========================
   ICONOS INFERIORES
========================= */

.icons{
  margin-top:20px;

  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:12px;
}


.icon{
  min-width:92px;

  padding:
    10px
    12px;

  border-radius:14px;

  border:
    1px solid
    var(--line);

  background:#fff9f2;

  color:var(--text);

  font-size:13px;
}


.icon b{
  display:block;

  margin-bottom:3px;

  font-size:22px;
}


/* =========================
   FOOTER
========================= */

footer{
  margin-top:18px;

  color:var(--muted);

  font-size:12px;
}


/* =========================
   CELULARES
========================= */

@media(max-width:500px){

  body{
    padding:12px;
  }

  .card{
    padding:
      18px
      14px;

    border-radius:22px;
  }

  .brand{
    gap:9px;

    margin-bottom:16px;
  }

  .duck{
    width:64px;
    height:64px;

    flex-basis:64px;

    border-radius:17px;
  }

  .brand strong{
    font-size:25px;
  }

  .game{
    padding:
      21px
      13px;
  }

  .game-icon{
    font-size:46px;
  }

  .btn{
    padding:
      17px
      18px;

    font-size:19px;
  }

  .icons{
    gap:8px;
  }

  .icon{
    min-width:
      calc(50% - 5px);
  }

}


/* =========================
   PANTALLAS MUY PEQUEÑAS
========================= */

@media(max-width:350px){

  .brand strong{
    font-size:22px;
  }

  .duck{
    width:58px;
    height:58px;

    flex-basis:58px;
  }

}

</style>
</head>


<body>


<main class="card">


  <!-- MARCA -->

  <div class="brand">

    <div class="duck">

      <picture>

        <!--
        VERSION RECOMENDADA
        SOLO 18 KB APROX.
        -->

        <source
          srcset="pato-gamer-256.webp"
          type="image/webp"
        >

        <!--
        FALLBACK PNG
        -->

        <img
          src="pato-gamer-256-optimizado.png"
          alt="PatoNuclear"
          width="78"
          height="78"
          decoding="async"
        >

      </picture>

    </div>


    <strong>
      PatoNuclear
    </strong>

  </div>



  <!-- CONTENIDO -->

  <section class="game">


    <div class="game-icon">
      ⛏️
    </div>


    <h1>
      EL JUEGO
    </h1>


    <div class="version">

      26.45 · Android

    </div>



    <p class="update-info">

      ✨

      <strong>
        Novedades v26.45:
      </strong>

      Optimización de rendimiento,
      corrección de errores y mejoras
      de estabilidad general.

    </p>



    <!-- BOTON -->

    <a
      class="btn"
      href="https://subtounlock.app/u/paton2645"
      target="_blank"
      rel="noopener noreferrer"
    >

      ⬇️ CLICK AQUÍ

    </a>



    <p class="small">

      Un botón. Sin anuncios.
      Sin ventanas falsas.

    </p>


  </section>



  <!-- ICONOS -->

  <div class="icons">


    <div class="icon">

      <b>📱</b>

      Android

    </div>


    <div class="icon">

      <b>⚡</b>

      Rápido

    </div>


    <div class="icon">

      <b>🚫</b>

      Sin anuncios

    </div>


    <div class="icon">

      <b>🛡️</b>

      Seguro

    </div>


  </div>



  <!-- PIE -->

  <footer>

    PatoNuclear · Minecraft Bedrock 26.45

  </footer>


</main>


</body>
</html>
